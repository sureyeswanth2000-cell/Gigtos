name: Heart Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/heart-monitor.yml'

permissions:
  contents: read

jobs:
  heart-monitor:
    name: App liveliness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: react-app
        run: npx playwright install --with-deps chromium

      - name: Run Heart Monitor
        working-directory: react-app
        env:
          CI: true
          GIGTOS_SMOKE_URL: https://gigto.in
          REACT_APP_APPCHECK_RECAPTCHA_ENTERPRISE_SITE_KEY: 6LfJzvQsAAAAAO7eO16Wm4hWii7iIIOML_Q-Lnom
          REACT_APP_FIREBASE_STORAGE_BUCKET: gigtos-user-uploads-gigto-c0c83
          REACT_APP_REQUIRE_APPCHECK: 'true'
        run: npm run smoke:heart

      - name: Upload Heart Monitor reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heart-monitor-report
          path: |
            react-app/docs/HEART_MONITOR_LATEST.md
            react-app/docs/AI_OPS_EXTERNAL_SETUP_LATEST.md
            react-app/test-results/heart-monitor/**
          if-no-files-found: ignore
